[defaults]
deprecation_warnings = False
command_warnings = False
inventory = /usr/local/retronas-bsd/ansible/hosts.yml
log_path = /usr/local/retronas-bsd/log/ansible.log
callbacks_enabled = ansible.posix.profile_tasks,ansible.posix.profile_roles
callbacks_whitelist = ansible.posix.profile_tasks,ansible.posix.profile_roles
cache = True
gathering = smart
fact_caching=jsonfile
fact_caching_connection=/usr/local/retronas-bsd/cache
fact_caching_timeout=86400
collections_paths = /usr/local/retronas-bsd/ansible/collections
roles_path = /usr/local/retronas-bsd/ansible/roles
private_role_vars = True
