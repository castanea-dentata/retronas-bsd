---
my_name: "Samba"
my_file: ""  # required to clear out any play set var

# FreeBSD ships Samba as a versioned package (no plain "samba" meta-package).
# samba416 is the current ports default as of writing - if this install task
# fails with a "no such package" error, run `pkg search samba4` on the box
# and bump this to whatever's current.
# avahi-app is the headless build of avahi (avoids pulling in X11/Gnome,
# which the plain "avahi" package does).
packages:
  - avahi-app
  - samba416

# FreeBSD's Samba port runs a single samba_server rc.d service rather than
# split smbd/nmbd daemons.
my_services:
  - avahi-daemon
  - samba_server

# FreeBSD's samba pkg reads /usr/local/etc/smb4.conf, not /etc/samba/smb.conf
smb_conf_path: "/usr/local/etc/smb4.conf"

config_opts:
  - { section: "global",    option: "min protocol",               value: "CORE"}
  - { section: "global",    option: "netbios name",               value: "retrosmb"}
  - { section: "global",    option: "lanman auth",                value: "yes"}
  - { section: "global",    option: "client lanman auth",         value: "yes"}
  - { section: "global",    option: "ntlm auth",                  value: "yes"}
  - { section: "global",    option: "client ntlm auth",           value: "yes"}
  - { section: "global",    option: "ntlmv2 auth",                value: "yes"}
  - { section: "global",    option: "client ntlmv2 auth",         value: "yes"}
  - { section: "global",    option: "unix extensions",            value: "no"}
  - { section: "global",    option: "allow insecure wide links",  value: "yes"}
  - { section: "global",    option: "socket options",             value: "TCP_NODELAY IPTOS_LOWDELAY SO_KEEPALIVE"}
  - { section: "global",    option: "strict locking",             value: "no"}
  - { section: "global",    option: "strict sync",                value: "no"}
  - { section: "global",    option: "sync always",                value: "no"}
  - { section: "global",    option: "deadtime",                   value: "1560"}
  - { section: "retronas",  option: "include",                    value: "/usr/local/etc/retronas.conf"}

templates:
  - { name: "retronas.conf", dest: "/usr/local/etc" }

firewalld_rules:
  - { zone: "retro",  service: "samba" }
  - { zone: "modern", service: "retronas-samba-modern" }

changed: false
